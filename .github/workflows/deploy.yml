name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # Nothing reaches production without the suite passing. deploy.yml previously ran
  # on any push to main with no gate at all, so an unreviewed push could run an
  # Alembic migration against the live database.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: doc-manager — lint + tests
        working-directory: doc-manager
        run: |
          uvx ruff check app tests
          uv sync --frozen
          uv run pytest -q --no-cov
      - name: auth-service — lint + tests
        working-directory: auth-service
        env:
          DATABASE_URL: sqlite://
        run: |
          uvx ruff check app tests
          uv sync --frozen
          uv run pytest -q --no-cov

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service
          tags: |
            ${{ env.IMAGE_PREFIX }}/auth-service:latest
            ${{ env.IMAGE_PREFIX }}/auth-service:${{ github.sha }}

      - name: Build and push doc-manager
        uses: docker/build-push-action@v5
        with:
          context: ./doc-manager
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=doc-manager
          cache-to: type=gha,mode=max,scope=doc-manager
          tags: |
            ${{ env.IMAGE_PREFIX }}/doc-manager:latest
            ${{ env.IMAGE_PREFIX }}/doc-manager:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          build-args: |
            VITE_AUTH_API_URL=
            VITE_DOC_API_URL=
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Refresh GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --namespace=textara --dry-run=client -o yaml | kubectl apply -f -

      - name: Run Alembic migrations
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
        run: |
          kubectl run alembic-migrate-${{ github.run_id }} \
            --image=${{ env.IMAGE_PREFIX }}/auth-service:${{ github.sha }} \
            --restart=Never \
            --namespace=textara \
            --env="DATABASE_URL=$AUTH_DATABASE_URL" \
            --env="SECRET_KEY=$AUTH_SECRET_KEY" \
            --overrides='{"spec":{"imagePullSecrets":[{"name":"ghcr-credentials"}]}}' \
            --command -- .venv/bin/alembic upgrade head
          kubectl wait pod/alembic-migrate-${{ github.run_id }} \
            --for=condition=Ready --timeout=60s --namespace=textara || true
          kubectl wait pod/alembic-migrate-${{ github.run_id }} \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s --namespace=textara
          kubectl delete pod alembic-migrate-${{ github.run_id }} --namespace=textara

      - name: Sync Kubernetes secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          kubectl create secret generic auth-service-secret \
            --from-literal=DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=SECRET_KEY="$AUTH_SECRET_KEY" \
            --from-literal=RESEND_API_KEY="$RESEND_API_KEY" \
            --from-literal=ADMIN_API_KEY="$ADMIN_API_KEY" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --namespace=textara --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic doc-manager-secret \
            --from-literal=SECRET_KEY="$AUTH_SECRET_KEY" \
            --from-literal=RABBITMQ_PASS="$RABBITMQ_PASS" \
            --from-literal=R2_ENDPOINT_URL="$R2_ENDPOINT_URL" \
            --from-literal=R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            --from-literal=R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            --from-literal=R2_BUCKET_NAME="$R2_BUCKET_NAME" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=DATABASE_URL="$AUTH_DATABASE_URL" \
            --namespace=textara --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic rabbitmq-secret \
            --from-literal=RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASS" \
            --namespace=textara --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_TOKEN" \
            --namespace=textara --dry-run=client -o yaml | kubectl apply -f -

      - name: Record currently-running images (for a rollback that works)
        id: prev
        run: |
          # Must run before `apply`, which overwrites the live spec with the
          # manifests' :latest tag and makes `rollout undo` useless.
          for d in auth-service doc-manager doc-worker frontend; do
            IMG=$(kubectl get deploy/$d -n textara \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
            echo "${d}=${IMG}" >> $GITHUB_OUTPUT
            echo "previous ${d}: ${IMG:-<none>}"
          done

      - name: Apply Kubernetes manifests
        # k8s/local/ is local-dev-only (postgres), never applied to prod
        # secret.yaml files are templates only — real values already written by Sync step above
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ingress.yaml --namespace=textara
          kubectl apply -f k8s/www-redirect.yaml --namespace=textara
          kubectl apply -f k8s/cert-manager/ --namespace=textara
          kubectl apply -f k8s/rabbitmq/ --namespace=textara
          kubectl apply -f k8s/auth-service/configmap.yaml --namespace=textara
          kubectl apply -f k8s/auth-service/deployment.yaml --namespace=textara
          kubectl apply -f k8s/auth-service/service.yaml --namespace=textara
          kubectl apply -f k8s/doc-manager/configmap.yaml --namespace=textara
          kubectl apply -f k8s/doc-manager/deployment.yaml --namespace=textara
          kubectl apply -f k8s/doc-manager/service.yaml --namespace=textara
          kubectl apply -f k8s/doc-worker/ --namespace=textara
          kubectl apply -f k8s/frontend/ --namespace=textara

      - name: Inject GOOGLE_CLIENT_ID into configmap
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          kubectl patch configmap auth-service-config \
            --namespace=textara \
            --type=merge \
            -p "{\"data\": {\"GOOGLE_CLIENT_ID\": \"$GOOGLE_CLIENT_ID\"}}"

      - name: Pin deployments to SHA image
        run: |
          kubectl set image deployment/auth-service \
            auth-service=${{ env.IMAGE_PREFIX }}/auth-service:${{ github.sha }} \
            --namespace=textara
          kubectl set image deployment/doc-manager \
            doc-manager=${{ env.IMAGE_PREFIX }}/doc-manager:${{ github.sha }} \
            --namespace=textara
          kubectl set image deployment/doc-worker \
            doc-worker=${{ env.IMAGE_PREFIX }}/doc-manager:${{ github.sha }} \
            --namespace=textara
          kubectl set image deployment/frontend \
            frontend=${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            --namespace=textara

      - name: Wait for rollout
        id: rollout
        run: |
          # Check all four before failing, so the log names every broken service
          # rather than only the first one.
          FAILED=""
          for d in auth-service doc-manager doc-worker frontend; do
            kubectl rollout status "deployment/$d" --namespace=textara --timeout=5m || FAILED="$FAILED $d"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Rollout failed for:$FAILED"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          # `rollout undo` would return to the revision created by this run's own
          # `apply`, which carries the mutable :latest tag that this run just
          # overwrote with the broken image. Restore the recorded SHA instead.
          restore() {
            local dep="$1" container="$2" img="$3"
            if [ -z "$img" ] || [ "${img##*:}" = "latest" ]; then
              echo "::warning::No pinned previous image for $dep — leaving it alone."
              return
            fi
            echo "Restoring $dep to $img"
            kubectl set image "deployment/$dep" "$container=$img" --namespace=textara || true
            kubectl rollout status "deployment/$dep" --namespace=textara --timeout=3m || true
          }
          restore auth-service auth-service '${{ steps.prev.outputs.auth-service }}'
          restore doc-manager  doc-manager  '${{ steps.prev.outputs.doc-manager }}'
          restore doc-worker   doc-worker   '${{ steps.prev.outputs.doc-worker }}'
          restore frontend     frontend     '${{ steps.prev.outputs.frontend }}'

      # ── Grafana as code (best-effort: never fails the deploy) ──────────────
      - name: Grafana — ensure read-only DB role
        if: success()
        continue-on-error: true
        env:
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
        run: |
          kubectl exec -i -n textara deploy/auth-service -- \
            python -u - "$GRAFANA_DB_PASSWORD" < scripts/grafana_db_role.py

      - name: Grafana — provision datasource + dashboards
        if: success()
        continue-on-error: true
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: python3 scripts/grafana_provision.py
