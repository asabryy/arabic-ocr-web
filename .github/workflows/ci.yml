name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lockfiles in sync with pyproject (Docker builds use --frozen)
        run: |
          (cd doc-manager && uv lock --check)
          (cd auth-service && uv lock --check)
      - name: Grafana as code — lint + validate dashboards
        run: |
          uvx ruff check scripts
          python3 scripts/grafana_provision.py --validate
      - name: doc-manager — lint
        working-directory: doc-manager
        run: uvx ruff check app tests
      - name: doc-manager — tests (incl. Postgres quota tests)
        working-directory: doc-manager
        run: |
          uv sync --frozen
          uv run pytest -q --no-cov
      - name: auth-service — lint
        working-directory: auth-service
        run: uvx ruff check app tests
      - name: auth-service — tests (billing/webhook; SQLite, no network)
        working-directory: auth-service
        env:
          DATABASE_URL: sqlite://
        run: |
          uv sync --frozen
          uv run pytest -q --no-cov

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: false
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service

      - name: Build doc-manager
        uses: docker/build-push-action@v5
        with:
          context: ./doc-manager
          push: false
          cache-from: type=gha,scope=doc-manager
          cache-to: type=gha,mode=max,scope=doc-manager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_AUTH_API_URL: ''
          VITE_DOC_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
