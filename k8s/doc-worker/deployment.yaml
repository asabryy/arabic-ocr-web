apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-worker
  namespace: textara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-worker
  template:
    metadata:
      labels:
        app: doc-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: doc-worker
          image: ghcr.io/asabryy/doc-manager:latest
          command: ["python", "-m", "app.worker.consumer"]
          ports:
            - containerPort: 9100
              name: metrics
          # The metrics server starts before the RabbitMQ connect loop, so it doubles
          # as a cheap liveness signal for a process that otherwise exposes nothing.
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: doc-manager-config
            - secretRef:
                name: doc-manager-secret
          resources:
            requests:
              # Idles around 370Mi once PyMuPDF and the genai client are loaded.
              memory: "384Mi"
              cpu: "100m"
            limits:
              # Rendering a page to PNG spikes well past 512Mi on large scans — that cap
              # was OOMKilling the worker mid-task. The node has ~18Gi free.
              memory: "1Gi"
              cpu: "500m"
