apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-worker
  namespace: textara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-worker
  template:
    metadata:
      labels:
        app: doc-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      # A 10-page document takes 100-200s; the 30s default kills it mid-run.
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: doc-worker
          image: ghcr.io/asabryy/doc-manager:latest
          command: ["python", "-m", "app.worker.consumer"]
          ports:
            - containerPort: 9100
              name: metrics
          # The consumer refreshes /tmp/worker-alive every 30s from the AMQP I/O
          # loop. A TCP probe on the metrics port cannot detect a dead consumer —
          # that port is opened by a different thread and stays open regardless.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ $(( $(date +%s) - $(stat -c %Y /tmp/worker-alive) )) -lt 150 ]'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: doc-manager-config
            - secretRef:
                name: doc-manager-secret
          resources:
            requests:
              # Idles around 370Mi once PyMuPDF and the genai client are loaded.
              memory: "384Mi"
              cpu: "100m"
            limits:
              # Rendering a page to PNG spikes hard on large scans; 512Mi then 1Gi both
              # OOM-killed the worker mid-document, which costs the user their job and
              # re-bills Gemini on redelivery. The node has ~20Gi free and nothing to
              # contend with, so buy headroom rather than shave it.
              memory: "3Gi"
              cpu: "500m"
