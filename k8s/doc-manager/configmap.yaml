apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-manager-config
  namespace: textara
data:
  ALGORITHM: "HS256"
  STORAGE_BACKEND: "r2"
  UPLOAD_DIR: "/app/uploads"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_QUEUE: "ocr_tasks"
  CORS_ORIGINS: '["https://textara.app","https://www.textara.app"]'
  # OCR backend: "gemini" for prod (hosted Google Gemini vision), "http" for local dev
  OCR_BACKEND: "gemini"
  GEMINI_MODEL: "gemini-flash-latest"
