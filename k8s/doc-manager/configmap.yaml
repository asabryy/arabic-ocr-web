apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-manager-config
  namespace: textara
data:
  ALGORITHM: "HS256"
  STORAGE_BACKEND: "r2"
  UPLOAD_DIR: "/app/uploads"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_QUEUE: "ocr_tasks"
  CORS_ORIGINS: '["https://textara.app","https://www.textara.app"]'
  # OCR backend: "gemini" for prod (hosted Google Gemini vision), "http" for local dev
  OCR_BACKEND: "gemini"
  GEMINI_MODEL: "gemini-flash-latest"
  # Plan limits (pages) — enforced at /convert, surfaced by /usage
  PLAN_FREE_DAILY_PAGES: "10"
  PLAN_FREE_MAX_DOC_PAGES: "10"
  PLAN_PRO_DAILY_PAGES: "50"
  PLAN_PRO_MAX_DOC_PAGES: "40"
  # Anonymous landing-page trial
  TRIAL_MAX_PAGES: "1"
  TRIAL_RATE_LIMIT: "3/day"
  TRIAL_MAX_UPLOAD_MB: "10"
  # Real client IP header behind ingress-nginx (use CF-Connecting-IP if Cloudflare-proxied)
  CLIENT_IP_HEADER: "X-Forwarded-For"
  # Worker metrics + Gemini rate-limit backoff + cost estimate (shared by doc-manager/doc-worker)
  WORKER_METRICS_PORT: "9100"
  OCR_429_MAX_RETRIES: "6"
  OCR_429_MAX_DELAY_S: "60"
  GEMINI_PRICE_INPUT_USD_PER_M: "0.75"
  GEMINI_PRICE_OUTPUT_USD_PER_M: "3.75"
