# Template only — real values injected by CI from GitHub Actions secrets
# Do NOT commit real values here
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: textara
type: Opaque
stringData:
  DATABASE_URL: ""
  SECRET_KEY: ""
  RESEND_API_KEY: ""
  ADMIN_API_KEY: ""
  # Stripe — prefer a restricted key (rk_...) over sk_. Empty disables /billing.
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  # Shared with the worker as NOTIFY_API_KEY. Empty disables /internal.
  INTERNAL_API_KEY: ""
