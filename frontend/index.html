<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- This is a client-rendered SPA: the HTML a crawler receives first is
         essentially empty, so these tags carry the weight. "Arabic PDF to Word"
         is the phrase people actually search; "DOCX" is not. -->
    <title>Arabic PDF to Word — Convert Arabic PDFs Online | Textara</title>
    <meta
      name="description"
      content="Convert Arabic PDFs to editable Word documents. Right-to-left layout, tashkeel, tables and headings preserved. Scanned pages read with OCR. Free to try, no account."
    />
    <link rel="canonical" href="https://textara.app/" />
    <meta name="robots" content="index, follow" />

    <!-- The site serves the same URL in both languages, switched client-side. -->
    <link rel="alternate" hreflang="en" href="https://textara.app/" />
    <link rel="alternate" hreflang="ar" href="https://textara.app/" />
    <link rel="alternate" hreflang="x-default" href="https://textara.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://textara.app/" />
    <meta property="og:site_name" content="Textara" />
    <meta property="og:title" content="Arabic PDF to Word — Convert Arabic PDFs Online" />
    <meta
      property="og:description"
      content="Upload an Arabic PDF and get a Word file you can actually edit — right-to-left layout, tashkeel and tables intact."
    />
    <meta property="og:image" content="https://textara.app/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arabic PDF to Word — Convert Arabic PDFs Online" />
    <meta
      name="twitter:description"
      content="Upload an Arabic PDF and get a Word file you can actually edit — right-to-left layout, tashkeel and tables intact."
    />
    <meta name="twitter:image" content="https://textara.app/logo.png" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data. Only claims that are true and checkable: what it does,
         that there is a free tier, and the paid price. No ratings or review
         counts, which Google penalises when unverifiable. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Textara",
        "url": "https://textara.app/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "inLanguage": ["ar", "en"],
        "description": "Convert Arabic PDFs to editable Word documents, preserving right-to-left layout, tashkeel, tables and headings. Scanned pages are read with OCR.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD",
            "description": "10 pages per day, up to 10 pages per document."
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "9.99",
            "priceCurrency": "USD",
            "description": "50 pages per day, up to 40 pages per document."
          }
        ]
      }
    </script>

    <!-- Prevent dark mode flash -->
    <script>
      (function () {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
