version: "3.8"

# Local dev stack. Copy .env.example -> .env first.
# Postgres is shared by auth-service (owner of the schema / Alembic migrations)
# and doc-manager + doc-worker (plan quotas).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: textara
      POSTGRES_PASSWORD: textara
      POSTGRES_DB: textara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textara"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:dev
    env_file:
      - ./.env            # project-root/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://textara:textara@postgres:5432/textara}
    command: sh -c ".venv/bin/alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./auth-service/app:/app/app
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  doc-manager:
    build:
      context: ./doc-manager
      dockerfile: Dockerfile
    image: doc-manager:dev
    env_file:
      - ./.env
    environment:
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: local
      OCR_BACKEND: ${OCR_BACKEND:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://textara:textara@postgres:5432/textara}
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - ./doc-manager/app:/app/app
      - ./doc-manager/uploads:/app/uploads
    networks:
      - backend

  doc-worker:
    image: doc-manager:dev
    env_file:
      - ./.env
    environment:
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: local
      OCR_BACKEND: ${OCR_BACKEND:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://textara:textara@postgres:5432/textara}
    command: python -m app.worker.consumer
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - ./doc-manager/app:/app/app
      - ./doc-manager/uploads:/app/uploads
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: http://localhost:8000
        VITE_DOC_API_URL: http://localhost:8001
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - doc-manager
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
